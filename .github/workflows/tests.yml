name: pipeline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 pytest==8.3.5
      - run: python -B code/setup_project.py --source-only
      - run: python -B -m pytest tests -q -p no:cacheprovider
